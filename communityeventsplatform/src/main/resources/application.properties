
spring.application.name=communityeventsplatform

# H2 database stored in a local file
spring.datasource.url=jdbc:h2:file:./data/communityeventsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create or update database tables
spring.jpa.hibernate.ddl-auto=update

# Show database queries in the terminal
spring.jpa.show-sql=true

# Enable the H2 database console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
